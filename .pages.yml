# SDL content editor — https://app.pagescms.org/
# Work and Writing context are editable without changing site code.
media:
  input: assets/uploads
  output: /assets/uploads
content:
  - name: projects
    label: Work projects
    type: file
    path: content/projects.json
    format: json
    fields:
      - name: projects
        label: Projects
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - name: id
            label: URL identifier
            type: string
            required: true
            description: "Lowercase slug used in project links, e.g. brechschnell. Avoid changing existing IDs."
          - name: title
            label: Project name
            type: string
            required: true
          - name: category
            label: Category
            type: select
            required: true
            options:
              values:
                - name: bicycles
                  label: Bicycles
                - name: keyboards
                  label: Keyboards
                - name: lamps
                  label: Lamps
          - name: period
            label: Date / period
            type: string
          - name: show_period
            label: Show date / period
            type: boolean
            default: true
            description: "Turn off to hide this detail on the website without deleting its text."
          - name: status
            label: Status / whereabouts
            type: string
          - name: show_status
            label: Show status / whereabouts
            type: boolean
            default: true
            description: "Turn off to hide this detail on the website without deleting its text."
          - name: materials
            label: Materials
            type: text
            description: "Main materials used in the project, such as steel, aluminum, acrylic, or wood."
          - name: show_materials
            label: Show materials
            type: boolean
            default: true
            description: "Turn off to hide this detail on the website without deleting its text."
          - name: fabrication_methods
            label: Fabrication methods
            type: text
            description: "How the project was made, such as 3D printing, CNC machining, welding, or hand assembly."
          - name: show_fabrication_methods
            label: Show fabrication methods
            type: boolean
            default: true
            description: "Turn off to hide this detail on the website without deleting its text."
          - name: inspirations
            label: Inspirations
            type: text
            description: "People, objects, references, or designs that inspired this project. Supports Markdown links [label](https://example.com), **bold**, *italics*, and line breaks."
          - name: show_inspirations
            label: Show inspirations
            type: boolean
            default: true
            description: "Turn off to hide this detail on the website without deleting its text."
          - name: description
            label: Project description
            type: text
            description: "Supports Markdown links [label](https://example.com), **bold**, *italics*, and line breaks."
          - name: images
            label: Gallery image paths
            type: string
            list: true
            description: "First image is the cover. Use existing repo filenames or assets/uploads/name.jpg for new uploads."
  - name: writing_contexts
    label: Writing context
    type: file
    path: content/writing-context.json
    format: json
    fields:
      - name: writing_contexts
        label: Articles
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - name: slug
            label: Article identifier
            type: string
            required: true
            description: "Matches the article filename without .html; do not change existing identifiers."
          - name: title
            label: Short article title / browser tab
            type: string
            required: true
            description: "Short label used in Pages CMS and the article browser tab."
          - name: headline
            label: Article headline
            type: text
            description: "Full visible heading on the article page and Writing archive. The article body remains in HTML."
          - name: period
            label: Date / period
            type: string
          - name: show_period
            label: Show date / period
            type: boolean
            default: true
            description: "Turn off to hide this detail without deleting its text."
          - name: type
            label: Type
            type: string
          - name: show_type
            label: Show type
            type: boolean
            default: true
            description: "Turn off to hide this detail without deleting its text."
          - name: status
            label: Status / whereabouts
            type: string
          - name: show_status
            label: Show status / whereabouts
            type: boolean
            default: true
            description: "Turn off to hide this detail without deleting its text."
          - name: note
            label: Context note
            type: text
            description: "Supports Markdown links [label](https://example.com), **bold**, *italics*, and line breaks."
          - name: show_note
            label: Show context note
            type: boolean
            default: true
            description: "Turn off to hide the note without deleting its text."

  - name: navigation
    label: Navigation labels
    type: file
    path: content/navigation.json
    format: json
    fields:
      - name: home
        label: "Home button"
        type: object
        fields:
          - name: en
            label: "English (master) label"
            type: string
            required: true
          - name: de
            label: "German label"
            type: string
          - name: fr
            label: "French label"
            type: string
          - name: ja
            label: "Japanese label"
            type: string
          - name: visible
            label: Show button
            type: boolean
            default: true
            description: "Hide this button without losing its labels."
      - name: work
        label: "Work button"
        type: object
        fields:
          - name: en
            label: "English (master) label"
            type: string
            required: true
          - name: de
            label: "German label"
            type: string
          - name: fr
            label: "French label"
            type: string
          - name: ja
            label: "Japanese label"
            type: string
          - name: visible
            label: Show button
            type: boolean
            default: true
            description: "Hide this button without losing its labels."
      - name: writing
        label: "Writing button"
        type: object
        fields:
          - name: en
            label: "English (master) label"
            type: string
            required: true
          - name: de
            label: "German label"
            type: string
          - name: fr
            label: "French label"
            type: string
          - name: ja
            label: "Japanese label"
            type: string
          - name: visible
            label: Show button
            type: boolean
            default: true
            description: "Hide this button without losing its labels."
      - name: about
        label: "About button"
        type: object
        fields:
          - name: en
            label: "English (master) label"
            type: string
            required: true
          - name: de
            label: "German label"
            type: string
          - name: fr
            label: "French label"
            type: string
          - name: ja
            label: "Japanese label"
            type: string
          - name: visible
            label: Show button
            type: boolean
            default: true
            description: "Hide this button without losing its labels."
      - name: contact
        label: "Say hello button"
        type: object
        fields:
          - name: en
            label: "English (master) label"
            type: string
            required: true
          - name: de
            label: "German label"
            type: string
          - name: fr
            label: "French label"
            type: string
          - name: ja
            label: "Japanese label"
            type: string
          - name: visible
            label: Show button
            type: boolean
            default: true
            description: "Hide this button without losing its labels."

  - name: about_page
    label: About page
    type: file
    path: content/about.json
    format: json
    fields:
      - name: id
        label: "Record identifier"
        type: string
        hidden: true
        description: "Internal fixed identifier used by the translation workflow."
      - name: headline_first
        label: "First headline line"
        type: string
      - name: headline_accent
        label: "Blue headline line"
        type: string
      - name: intro
        label: "Short introduction"
        type: text
      - name: interests
        label: "Interests line"
        type: text
      - name: portrait
        label: "Portrait image path"
        type: string
      - name: portrait_alt
        label: "Portrait alt text"
        type: string

  - name: credits_page
    label: Credits page
    type: file
    path: content/credits.json
    format: json
    fields:
      - name: id
        label: "Record identifier"
        type: string
        hidden: true
        description: "Internal fixed identifier used by the translation workflow."
      - name: page_title
        label: "Page title"
        type: string
      - name: creative_heading
        label: "Creative work heading"
        type: string
      - name: creative_text
        label: "Creative work text"
        type: text
        description: "Supports Markdown links such as [name](https://example.com)."
      - name: code_heading
        label: "Website code heading"
        type: string
      - name: code_text
        label: "Website code text"
        type: text
        description: "Supports Markdown links such as [name](https://example.com)."
      - name: cms_heading
        label: "Content editing heading"
        type: string
      - name: cms_text
        label: "Content editing text"
        type: text
        description: "Supports Markdown links such as [name](https://example.com)."
      - name: translation_heading
        label: "Translation heading"
        type: string
      - name: translation_text
        label: "Translation disclaimer"
        type: text
        description: "Supports Markdown links such as [name](https://example.com)."
      - name: source_heading
        label: "Source heading"
        type: string
      - name: source_text
        label: "Source text"
        type: text
        description: "Supports Markdown links such as [name](https://example.com)."
